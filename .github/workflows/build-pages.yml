name: Deploy PDF Site

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate index.html dynamically
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Automated PDF Library</title>
              <style>
                  body, html { margin: 0; padding: 0; height: 100%; display: flex; font-family: sans-serif; }
                  sidebar { width: 250px; background: #222; color: white; padding: 15px; box-sizing: border-box; overflow-y: auto; }
                  h3 { margin-top: 0; color: #aaa; }
                  ul { list-style: none; padding: 0; }
                  li { margin-bottom: 10px; }
                  button { width: 100%; text-align: left; padding: 10px; background: #333; color: #fff; border: none; cursor: pointer; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
                  button:hover { background: #444; }
                  iframe { border: none; flex-grow: 1; height: 100%; }
              </style>
          </head>
          <body>
              <sidebar>
                  <h3>My Documents</h3>
                  <ul>
          EOF

          # Enable nullglob so the loop cleanly skips if zero PDFs exist
          shopt -s nullglob
          
          first_pdf=""
          pdf_count=0

          for file in *.pdf; do
              if [ -f "$file" ]; then
                  pdf_count=$((pdf_count+1))
                  if [ -z "$first_pdf" ]; then first_pdf="./$file"; fi
                  echo "<li><button onclick=\"changePDF('./$file')\">${file%.*}</button></li>" >> index.html
              fi
          done

          # If no PDFs were found, add a placeholder message
          if [ $pdf_count -eq 0 ]; then
              echo "<li><span style='color:#aaa; padding:10px; display:block;'>No PDFs found yet</span></li>" >> index.html
          fi

          cat << EOF >> index.html
                  </ul>
              </sidebar>
              <iframe id="pdf-viewer" src="$first_pdf"></iframe>
              <script>
                  function changePDF(path) { document.getElementById('pdf-viewer').src = path; }
              </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
